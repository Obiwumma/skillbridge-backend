databases:
  - name: skillbridge-db
    databaseName: skillbridge
    plan: free
    region: oregon

services:
  - type: web
    name: skillbridge-api
    plan: free
    region: oregon
    env: docker
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: skillbridge-db
          property: connectionString
      - key: REDIS_ADDR
        fromService:
          type: keyvalue
          name: skillbridge-cache
          property: connectionString

  - type: keyvalue
    name: skillbridge-cache
    plan: free
    region: oregon
    ipAllowList: []
