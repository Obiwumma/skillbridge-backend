version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=production
      - APP_PORT=8080
      - JWT_SECRET=production-secret-key-please-rotate
      - JWT_REFRESH_SECRET=production-refresh-secret-key-please-rotate
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=skillbridge
      - DB_SSLMODE=disable
      - REDIS_ADDR=redis:6379
      - NATS_URL=nats://nats:4222
      - JUDGE0_URL=https://judge0-ce.p.rapidapi.com
      - JUDGE0_KEY=your-rapidapi-judge0-key
      - EXTERNAL_AI_URL=https://api.external-ai.com
      - EXTERNAL_AI_KEY=your-external-ai-key
    depends_on:
      - postgres
      - redis
      - nats
    restart: always

  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=skillbridge
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: always

  nats:
    image: nats:2.9-alpine
    ports:
      - "4222:4222"
      - "8222:8222" # NATS management console monitoring port
    restart: always

volumes:
  pgdata:
  redisdata:
